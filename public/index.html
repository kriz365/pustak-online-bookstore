<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pustak — Mini Bookstore</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
:root{--ink:#10282c;--ink2:#1b3d42;--paper:#eef2ee;--card:#fff;--saffron:#f2a516;--line:#d3dcd6;--err:#b3261e;--ok:#1b7a4b;--muted:#5a6b6a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Instrument Sans",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
h1,h2,h3,.display{font-family:"Bricolage Grotesque",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
header{background:var(--ink);color:#fff;padding:12px 5vw;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:5}
.logo{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.7rem;letter-spacing:-.03em;margin:0}
.logo span{color:var(--saffron)}
.hsearch{flex:1;max-width:460px;margin-left:auto}
.hsearch input{width:100%;padding:10px 16px;border-radius:999px;border:0;background:var(--ink2);color:#fff}
.hsearch input::placeholder{color:#9db4b0}
.cartbtn{position:relative;background:var(--saffron);color:var(--ink);border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}
.cartbtn b{background:var(--ink);color:#fff;border-radius:999px;padding:1px 8px;margin-left:8px;font-size:.85rem}
.cartbtn.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.12)}}
.hero{background:linear-gradient(135deg,var(--ink) 0%,#173b40 100%);color:#fff;padding:56px 5vw 0;overflow:hidden}
.heroin{max-width:1200px;margin:auto;display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:end}
.hero h2{font-size:clamp(2.2rem,5vw,4rem);line-height:1.02;letter-spacing:-.035em;margin:0 0 16px;font-weight:800}
.hero p{max-width:46ch;color:#c5d6d3;margin:0 0 28px;font-size:1.05rem}
.hero .btn{background:var(--saffron);border-color:var(--saffron);color:var(--ink);padding:12px 22px;border-radius:999px}
.shelf{display:flex;align-items:flex-end;gap:6px;justify-content:center;border-bottom:10px solid #0a1a1d;padding:0 10px}
.spine{width:44px;border-radius:4px 4px 0 0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Bricolage Grotesque";font-weight:600;font-size:.82rem;writing-mode:vertical-rl;transition:transform .25s;border-right:3px solid rgba(0,0,0,.25)}
.spine:hover{transform:translateY(-16px) rotate(-3deg)}
main{padding:36px 5vw 70px;max-width:1200px;margin:auto}
.sechead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sechead h3{margin:0;font-size:1.8rem;letter-spacing:-.02em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:600}
.chip.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 22px}
.book{display:flex;flex-direction:column;gap:12px}
.cover{position:relative;aspect-ratio:2/3;border-radius:4px 10px 10px 4px;padding:18px 16px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 8px 0 0 rgba(0,0,0,.22),0 14px 22px -10px rgba(16,40,44,.55);transition:transform .25s,box-shadow .25s;overflow:hidden}
.book:hover .cover{transform:translateY(-6px) rotate(-1deg);box-shadow:inset 8px 0 0 rgba(0,0,0,.22),0 24px 28px -12px rgba(16,40,44,.6)}
.cover .t{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.45rem;line-height:1.05;letter-spacing:-.02em;position:relative;z-index:1;padding-left:6px}
.cover .a{font-size:.8rem;opacity:.9;position:relative;z-index:1;padding-left:6px}
.Fiction{background:radial-gradient(circle at 80% 15%,#f2a516 0 22%,transparent 23%),linear-gradient(160deg,#8c2f5a,#4d1636)}
.Biography{background:repeating-linear-gradient(135deg,rgba(255,255,255,.09) 0 10px,transparent 10px 22px),linear-gradient(160deg,#2f7a6b,#123d37)}
.History{background:linear-gradient(transparent 62%,rgba(0,0,0,.28) 62%),radial-gradient(circle at 20% 78%,#f2a516 0 14%,transparent 15%),linear-gradient(160deg,#a8671f,#5a330b)}
.Technology{background:linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(0deg,rgba(255,255,255,.07) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(160deg,#2d55b8,#162b66)}
.binfo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.binfo small{color:var(--muted);display:block}
.price{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.25rem}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.add{border-radius:999px;background:var(--saffron);border-color:var(--saffron);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:rise .25s}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px)}}
aside{position:fixed;top:0;right:0;height:100%;width:min(450px,100%);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .28s;z-index:10;display:flex;flex-direction:column;border-radius:18px 0 0 18px}
aside.open{transform:none}
.ahead{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.ahead h2{margin:0;font-size:1.5rem}
.abody{padding:8px 22px 22px;overflow:auto;flex:1}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mini{width:42px;height:60px;border-radius:3px 6px 6px 3px;flex:none}
.line .info{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;cursor:pointer;font-weight:700}
.rm{background:none;border:0;color:var(--err);cursor:pointer;font-size:.8rem;padding:0}
.total{display:flex;justify-content:space-between;font-family:"Bricolage Grotesque";font-weight:800;font-size:1.3rem;padding:16px 0}
label{display:block;font-weight:600;font-size:.9rem;margin-top:12px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-top:4px;background:#fafcfb}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ink)}
.field.bad input,.field.bad textarea,.field.bad select{border-color:var(--err);background:#fff6f5}
.msg{color:var(--err);font-size:.82rem;margin-top:3px}
.banner{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-weight:600}
.banner.ok{background:#dff3e8;color:var(--ok)}.banner.err{background:#fbe3e1;color:var(--err)}
.check{display:flex;gap:8px;align-items:center;font-weight:400;margin-top:16px;font-size:.88rem;color:var(--muted)}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.scrim{position:fixed;inset:0;background:rgba(10,26,29,.5);z-index:9}
footer{text-align:center;color:var(--muted);padding:0 5vw 40px;font-size:.9rem}
@media (max-width:760px){.heroin{grid-template-columns:1fr}.shelf{display:none}.hero{padding-bottom:40px}.hsearch{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script type="text/babel">
const { useState, useReducer, useEffect, useMemo } = React;
const inr = (n) => "₹" + n.toLocaleString("en-IN");
const COLORS = { Fiction: "#8c3b5e", Biography: "#2f6f62", History: "#8a5a1f", Technology: "#2b4c9b" };

// ---- Cart state: useReducer ----
function cartReducer(state, a) {
  switch (a.type) {
    case "add": {
      const f = state.find((i) => i.id === a.book.id);
      if (f) return state.map((i) => i.id === f.id ? { ...i, qty: Math.min(10, i.qty + 1) } : i);
      return [...state, { ...a.book, qty: 1 }];
    }
    case "inc": return state.map((i) => i.id === a.id ? { ...i, qty: Math.min(10, i.qty + 1) } : i);
    case "dec": return state.flatMap((i) => i.id !== a.id ? [i] : i.qty > 1 ? [{ ...i, qty: i.qty - 1 }] : []);
    case "remove": return state.filter((i) => i.id !== a.id);
    case "clear": return [];
    default: return state;
  }
}

// ---- Client-side rules (mirror the server; the server is still the authority) ----
const RULES = {
  name: (v) => !v ? "Name is required." : !/^[A-Za-z][A-Za-z .'-]{1,59}$/.test(v) ? "Use 2–60 letters; spaces, . ' - allowed." : "",
  email: (v) => !v ? "Email is required." : !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? "Enter a valid email like name@example.com." : "",
  phone: (v) => !v ? "Phone number is required." : !/^[6-9]\d{9}$/.test(v) ? "Enter a 10-digit mobile number starting with 6–9." : "",
  address: (v) => !v ? "Address is required." : v.length < 10 ? "Address must be at least 10 characters." : "",
  pin: (v) => !v ? "PIN code is required." : !/^[1-9]\d{5}$/.test(v) ? "Enter a valid 6-digit PIN code." : "",
  payment: (v) => !v ? "Choose a payment method." : "",
};
const validate = (f) => Object.fromEntries(Object.entries(RULES).map(([k, fn]) => [k, fn(f[k].trim())]).filter(([, m]) => m));

function Field({ name, label, form, errors, onChange, onBlur, as = "input", children, ...rest }) {
  const Tag = as;
  return (
    <div className={"field" + (errors[name] ? " bad" : "")}>
      <label htmlFor={name}>{label}</label>
      <Tag id={name} name={name} value={form[name]} onChange={onChange} onBlur={onBlur}
        aria-invalid={!!errors[name]} aria-describedby={errors[name] ? name + "-e" : undefined} {...rest}>{children}</Tag>
      {errors[name] && <div className="msg" id={name + "-e"} role="alert">{errors[name]}</div>}
    </div>
  );
}

function Checkout({ cart, total, onDone, onBack }) {
  const [form, setForm] = useState({ name: "", email: "", phone: "", address: "", pin: "", payment: "" });
  const [errors, setErrors] = useState({});
  const [banner, setBanner] = useState(null);
  const [skip, setSkip] = useState(false);
  const [busy, setBusy] = useState(false);

  const onChange = (e) => {
    const { name, value } = e.target;
    setForm((f) => ({ ...f, [name]: value }));
    if (errors[name]) setErrors((er) => ({ ...er, [name]: RULES[name](value.trim()) }));
  };
  const onBlur = (e) => setErrors((er) => ({ ...er, [e.target.name]: RULES[e.target.name](e.target.value.trim()) }));

  async function submit(e) {
    e.preventDefault();
    setBanner(null);
    if (!skip) {
      const errs = validate(form);
      setErrors(errs);
      if (Object.keys(errs).length) return setBanner({ ok: false, text: "Fix the highlighted fields before placing your order." });
    }
    setBusy(true);
    try {
      const res = await fetch("/api/checkout", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...form, items: cart.map(({ id, qty }) => ({ id, qty })) }),
      });
      const data = await res.json();
      if (res.ok) onDone(data.message);
      else { setErrors(data.errors || {}); setBanner({ ok: false, text: "Server: " + data.message }); }
    } catch { setBanner({ ok: false, text: "Could not reach the server. Is it running?" }); }
    setBusy(false);
  }

  const p = { form, errors, onChange, onBlur };
  return (
    <form onSubmit={submit} noValidate>
      {banner && <div className={"banner " + (banner.ok ? "ok" : "err")} role="status">{banner.text}</div>}
      <Field name="name" label="Full name" autoComplete="name" {...p} />
      <Field name="email" label="Email" type="email" autoComplete="email" {...p} />
      <Field name="phone" label="Mobile number" inputMode="numeric" maxLength={10} {...p} />
      <Field name="address" label="Delivery address" as="textarea" rows={2} {...p} />
      <Field name="pin" label="PIN code" inputMode="numeric" maxLength={6} {...p} />
      <Field name="payment" label="Payment" as="select" {...p}>
        <option value="">Select…</option><option value="upi">UPI</option><option value="card">Card</option><option value="cod">Cash on delivery</option>
      </Field>
      {errors.items && <div className="msg" role="alert">{errors.items}</div>}
      <label className="check"><input type="checkbox" checked={skip} onChange={(e) => setSkip(e.target.checked)} />
        Skip browser checks (to see the server reject bad input)</label>
      <div className="total"><span>Total</span><span>{inr(total)}</span></div>
      <div style={{ display: "flex", gap: 8 }}>
        <button type="button" className="btn ghost" onClick={onBack}>Back to cart</button>
        <button className="btn" style={{ flex: 1 }} disabled={busy}>{busy ? "Placing order…" : "Place order"}</button>
      </div>
    </form>
  );
}

function App() {
  const [books, setBooks] = useState([]);
  const [search, setSearch] = useState("");
  const [category, setCategory] = useState("");
  const [cart, dispatch] = useReducer(cartReducer, []);
  const [open, setOpen] = useState(false);
  const [step, setStep] = useState("cart");
  const [notice, setNotice] = useState("");
  const [toast, setToast] = useState("");
  const [bump, setBump] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => {
      fetch(`/api/books?search=${encodeURIComponent(search)}&category=${encodeURIComponent(category)}`)
        .then((r) => r.json()).then((d) => setBooks(d.books));
    }, 200);
    return () => clearTimeout(t);
  }, [search, category]);

  const total = useMemo(() => cart.reduce((s, i) => s + i.price * i.qty, 0), [cart]);
  const count = cart.reduce((s, i) => s + i.qty, 0);
  const close = () => { setOpen(false); setStep("cart"); };
  const add = (b) => {
    dispatch({ type: "add", book: b });
    setToast(`Added “${b.title}” to your cart`); setBump(true);
    setTimeout(() => setBump(false), 400);
    clearTimeout(window.__t); window.__t = setTimeout(() => setToast(""), 2200);
  };
  const spines = [["Fiction", 150], ["Technology", 190], ["History", 130], ["Biography", 170], ["Fiction", 205], ["Technology", 140], ["History", 180]];

  return (
    <>
      <header>
        <h1 className="logo">Pustak<span>.</span></h1>
        <div className="hsearch"><input placeholder="Search title or author" value={search} onChange={(e) => setSearch(e.target.value)} aria-label="Search books" /></div>
        <button className={"cartbtn" + (bump ? " bump" : "")} onClick={() => setOpen(true)} aria-label={`Open cart, ${count} items`}>Cart<b>{count}</b></button>
      </header>

      <section className="hero">
        <div className="heroin">
          <div>
            <h2>Books worth carrying home.</h2>
            <p>Fiction, history, biography and the programming classics, picked by readers in Pune and delivered across India.</p>
            <a href="#shelf"><button className="btn">Browse the shelf</button></a>
          </div>
          <div className="shelf" aria-hidden="true">
            {spines.map(([c, h], k) => <div key={k} className={"spine " + c} style={{ height: h }}>{c}</div>)}
          </div>
        </div>
      </section>

      <main id="shelf">
        {notice && <div className="banner ok" role="status">{notice}</div>}
        <div className="sechead">
          <h3>On the shelf</h3>
          <div className="chips" role="group" aria-label="Filter by category">
            {["", ...Object.keys(COLORS)].map((c) => (
              <button key={c} className={"chip" + (category === c ? " on" : "")} onClick={() => setCategory(c)}>{c || "All"}</button>
            ))}
          </div>
        </div>
        {books.length === 0 && <p className="empty">No books match that search. Try a different title or author.</p>}
        <div className="grid">
          {books.map((b) => (
            <article className="book" key={b.id}>
              <div className={"cover " + b.category}><span className="t">{b.title}</span><span className="a">{b.author}</span></div>
              <div className="binfo">
                <div><span className="price">{inr(b.price)}</span><small>{b.category}</small></div>
                <button className="btn add" onClick={() => add(b)} aria-label={`Add ${b.title} to cart`}>Add</button>
              </div>
            </article>
          ))}
        </div>
      </main>
      <footer>Pustak is a demo store. No real orders are placed.</footer>

      {toast && <div className="toast" role="status">{toast}</div>}
      {open && <div className="scrim" onClick={close} />}
      <aside className={open ? "open" : ""} aria-hidden={!open}>
        <div className="ahead"><h2>{step === "cart" ? "Your cart" : "Checkout"}</h2>
          <button className="btn ghost" onClick={close}>Close</button></div>
        <div className="abody">
          {step === "cart" ? (cart.length === 0 ? <p className="empty">Your cart is empty. Add a book to get started.</p> : <>
            {cart.map((i) => (
              <div className="line" key={i.id}>
                <div className={"mini " + i.category} />
                <div className="info"><strong>{i.title}</strong><br /><small>{inr(i.price)} each</small><br />
                  <button className="rm" onClick={() => dispatch({ type: "remove", id: i.id })}>Remove</button></div>
                <div className="qty">
                  <button onClick={() => dispatch({ type: "dec", id: i.id })} aria-label={`Decrease ${i.title}`}>−</button>
                  <span>{i.qty}</span>
                  <button onClick={() => dispatch({ type: "inc", id: i.id })} aria-label={`Increase ${i.title}`}>+</button>
                </div>
              </div>
            ))}
            <div className="total"><span>Total</span><span>{inr(total)}</span></div>
            <button className="btn" style={{ width: "100%", padding: 12, borderRadius: 999 }} onClick={() => setStep("checkout")}>Continue to checkout</button>
          </>) : (
            <Checkout cart={cart} total={total} onBack={() => setStep("cart")}
              onDone={(m) => { dispatch({ type: "clear" }); setNotice(m); close(); window.scrollTo({ top: 0, behavior: "smooth" }); }} />
          )}
        </div>
      </aside>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
